
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SÜKARA | Cashier</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --green:#244a3d;
  --green2:#477966;
  --cream:#f8f7f2;
  --line:#e8ece6;
  --muted:#828982;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  color:var(--green);
  font-family:Cairo,sans-serif;
}

.top{
  background:var(--green);
  color:white;
  padding:16px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:48px;
  height:48px;
  object-fit:contain;
  background:white;
  border-radius:50%;
  padding:4px;
}

.brand h1{margin:0;font-size:22px}
.brand p{margin:0;color:#c5d6cb;font-size:11px}

.actions{display:flex;gap:8px}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  font:700 13px Cairo;
  cursor:pointer;
}

.btn:disabled{opacity:.6;cursor:not-allowed}

.btn-light{background:white;color:var(--green)}
.btn-outline{background:transparent;color:white;border:1px solid #ffffff55}

.wrap{
  width:min(1200px,92%);
  margin:28px auto;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.toolbar h2{margin:0;font-size:23px}
.muted{color:var(--muted);font-size:13px}

.orders{display:grid;gap:14px}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
  box-shadow:0 5px 20px #244a3d0a;
}

.head,.foot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.order-id{font-weight:800}
.date{font-size:12px;color:var(--muted)}

.pill{
  border-radius:20px;
  padding:5px 12px;
  font-size:12px;
  font-weight:800;
  background:#fff3d9;
  color:#a87516;
}

.pill.preparing{background:#e7efff;color:#3865ad}
.pill.completed{background:#e3f4e8;color:#32804b}
.pill.cancelled{background:#fde8e8;color:#bd4444}

.info{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  padding:16px 0;
  border-bottom:1px solid #f0f1ed;
}

.info span{
  display:block;
  color:var(--muted);
  font-size:12px;
}

.info strong{
  display:block;
  margin-top:3px;
  font-size:13px;
  overflow-wrap:anywhere;
}

.items{
  background:#fafbf8;
  border-radius:10px;
  padding:12px;
  margin-top:12px;
  display:grid;
  gap:7px;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  color:#626b64;
}

.foot{margin-top:14px}
.total{font-weight:800;font-size:17px}

.status{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.status select{
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px;
  font:600 13px Cairo;
  color:var(--green);
  background:white;
}

.print{background:var(--green);color:white}

.empty{
  background:white;
  border-radius:15px;
  padding:50px;
  text-align:center;
  color:var(--muted);
}

#login{
  position:fixed;
  inset:0;
  background:var(--cream);
  display:grid;
  place-items:center;
  padding:20px;
  z-index:10;
}

.loginbox{
  width:min(390px,100%);
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:28px;
  box-shadow:0 15px 50px #244a3d14;
  text-align:center;
}

.loginbox h2{margin:8px 0}

.pin{
  width:100%;
  text-align:center;
  letter-spacing:12px;
  font-size:28px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  margin:16px 0;
  direction:ltr;
}

.loginbox button{
  width:100%;
  background:var(--green);
  color:white;
}

.error{
  color:#b43d3d;
  font-size:13px;
  min-height:22px;
}

.hidden{display:none!important}

#notice{
  position:fixed;
  bottom:18px;
  left:18px;
  background:var(--green);
  color:white;
  padding:12px 18px;
  border-radius:10px;
  display:none;
  z-index:20;
}

@media(max-width:700px){
  .info{grid-template-columns:1fr 1fr}
  .wrap{margin:20px auto}
  .toolbar h2{font-size:19px}
}

@media print{
  .top,.toolbar,.status,.print{display:none!important}
  body{background:white}
  .wrap{width:100%;margin:0}
  .card{
    break-inside:avoid;
    box-shadow:none;
    border:1px solid #ccc;
    margin-bottom:10px;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="brand">
    <img src="./logo.png.jpg" alt="Sukara"
      onerror="this.style.display='none'">
    <div>
      <h1>SÜKARA</h1>
      <p>CASHIER DASHBOARD</p>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-outline" id="refresh">تحديث</button>
    <button class="btn btn-light" id="logout">تسجيل الخروج</button>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <div>
      <h2>طلبات الكاشير</h2>
      <div class="muted" id="connection">في انتظار تسجيل الدخول</div>
    </div>
    <div class="muted" id="lastUpdate"></div>
  </div>

  <div id="orders" class="orders">
    <div class="empty">سجّل الدخول لعرض الطلبات</div>
  </div>
</main>

<section id="login">
  <form class="loginbox" id="loginForm">
    <div style="font-size:38px">☕</div>
    <h2>دخول الكاشير</h2>
    <p class="muted">أدخل كود الدخول المكوّن من 4 أرقام</p>

    <input
      class="pin"
      id="pin"
      type="password"
      inputmode="numeric"
      pattern="[0-9]{4}"
      maxlength="4"
      placeholder="••••"
      autocomplete="off"
      required
    >

    <div class="error" id="loginError"></div>

    <button class="btn" type="submit" id="loginBtn">
      دخول
    </button>
  </form>
</section>

<div id="notice"></div>

<script>
"use strict";

// إعدادات Supabase
const SUPABASE_URL =
  "https://guklbwfbtwcixqdoekei.supabase.co";

const API =
  `${SUPABASE_URL}/functions/v1/cashier`;

const SESSION_KEY = "sukara_cashier_session";

let token = sessionStorage.getItem(SESSION_KEY) || "";
let knownIds = new Set();
let firstLoad = true;
let poller = null;
let loadingOrders = false;

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function money(v){
  return Number(v || 0).toLocaleString("en-US",{
    maximumFractionDigits:2
  }) + " ج.م";
}

function statusName(s){
  return ({
    new:"جديد",
    preparing:"قيد التحضير",
    completed:"مكتمل",
    cancelled:"ملغي"
  })[s] || "غير معروف";
}

async function api(action,body={}){
  const headers = {
    "Content-Type":"application/json"
  };

  if(token){
    headers.Authorization = `Bearer ${token}`;
  }

  let res;

  try{
    res = await fetch(API,{
      method:"POST",
      headers,
      body:JSON.stringify({action,...body})
    });
  }catch(error){
    throw new Error("تعذر الاتصال بالخادم. تحقق من الإنترنت.");
  }

  let data = {};

  try{
    data = await res.json();
  }catch{}

  if(!res.ok){
    const error = new Error(
      data.error || `خطأ في الخادم (${res.status})`
    );

    error.status = res.status;
    error.data = data;

    throw error;
  }

  return data;
}

function showLogin(message=""){
  $("login").classList.remove("hidden");
  $("loginError").textContent = message;
}

function stopPolling(){
  if(poller){
    clearInterval(poller);
    poller = null;
  }
}

function startPolling(){
  stopPolling();

  poller = setInterval(()=>{
    loadOrders();
  },5000);
}

function beep(){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    const c = new C();

    const o = c.createOscillator();
    const g = c.createGain();

    o.connect(g);
    g.connect(c.destination);

    o.frequency.value = 880;
    g.gain.value = .12;

    o.start();
    o.stop(c.currentTime + .22);

    setTimeout(()=>c.close(),350);
  }catch{}
}

function notifyNew(order){
  beep();

  $("notice").textContent =
    `طلب جديد وصل — #${String(order.id).slice(0,8)}`;

  $("notice").style.display = "block";

  setTimeout(()=>{
    $("notice").style.display = "none";
  },5000);

  if(
    "Notification" in window &&
    Notification.permission === "granted"
  ){
    new Notification("طلب جديد من سُكَره",{
      body:`طلب رقم ${String(order.id).slice(0,8)} — ${order.customer_name || ""}`
    });
  }
}

function orderCard(o){
  const items = Array.isArray(o.items) ? o.items : [];
  const delivery = o.fulfillment_type === "delivery";

  return `
  <article class="card">

    <div class="head">
      <div>
        <div class="order-id">
          أوردر #${esc(String(o.id).slice(0,8))}
        </div>

        <div class="date">
          ${esc(new Date(o.created_at).toLocaleString("ar-EG"))}
        </div>
      </div>

      <span class="pill ${esc(o.status)}">
        ${statusName(o.status)}
      </span>
    </div>

    <div class="info">

      <div>
        <span>اسم العميل</span>
        <strong>${esc(o.customer_name)}</strong>
      </div>

      <div>
        <span>رقم التليفون</span>
        <strong dir="ltr">${esc(o.customer_phone)}</strong>
      </div>

      <div>
        <span>نوع الطلب</span>
        <strong>${delivery ? "Delivery" : "In Place"}</strong>
      </div>

      <div>
        <span>العنوان</span>
        <strong>
          ${delivery ? esc(o.delivery_area || "غير محدد") : "—"}
        </strong>
      </div>

    </div>

    <div class="items">
      ${
        items.map(i=>`
          <div class="item">
            <span>
              ${esc(i.name)} × ${Number(i.quantity || 0)}
            </span>

            <strong>
              ${money(
                i.subtotal ??
                (Number(i.unit_price || 0) * Number(i.quantity || 0))
              )}
            </strong>
          </div>
        `).join("") || "<div>لا توجد تفاصيل أصناف</div>"
      }
    </div>

    <div class="foot">

      <div class="total">
        الإجمالي: ${money(o.total)}
      </div>

      <div class="status">

        <label class="muted">الحالة</label>

        <select data-order="${esc(o.id)}">
          <option value="new" ${o.status==="new"?"selected":""}>
            جديد
          </option>

          <option value="preparing" ${o.status==="preparing"?"selected":""}>
            قيد التحضير
          </option>

          <option value="completed" ${o.status==="completed"?"selected":""}>
            مكتمل
          </option>

          <option value="cancelled" ${o.status==="cancelled"?"selected":""}>
            ملغي
          </option>
        </select>

        <button class="btn print" data-print="${esc(o.id)}">
          طباعة الطلب
        </button>

      </div>

    </div>

  </article>`;
}

function printOrder(o){
  const w = window.open("","_blank","width=420,height=650");

  if(!w){
    alert("اسمح بفتح النوافذ المنبثقة للطباعة");
    return;
  }

  const lines = (o.items || []).map(i=>`
    <tr>
      <td>${esc(i.name)} × ${Number(i.quantity || 0)}</td>
      <td>
        ${money(
          i.subtotal ??
          (Number(i.unit_price || 0) * Number(i.quantity || 0))
        )}
      </td>
    </tr>
  `).join("");

  w.document.write(`
    <!doctype html>
    <html lang="ar" dir="rtl">
    <meta charset="utf-8">
    <title>Order</title>

    <style>
      body{
        font-family:Arial,sans-serif;
        padding:18px;
        color:#111
      }

      h2{text-align:center}

      table{
        width:100%;
        border-collapse:collapse
      }

      td{
        padding:9px 3px;
        border-bottom:1px dashed #aaa
      }

      .total{
        font-weight:bold;
        font-size:18px;
        margin-top:18px
      }
    </style>

    <h2>سُكَــــره<br><small>إيصال طلب</small></h2>

    <p>رقم الطلب: ${esc(String(o.id).slice(0,8))}</p>
    <p>التاريخ: ${esc(new Date(o.created_at).toLocaleString("ar-EG"))}</p>
    <p>العميل: ${esc(o.customer_name)}</p>
    <p>الهاتف: ${esc(o.customer_phone)}</p>
    <p>النوع: ${o.fulfillment_type==="delivery"?"Delivery":"In Place"}</p>

    ${
      o.fulfillment_type==="delivery"
      ? `<p>العنوان: ${esc(o.delivery_area)}</p>`
      : ""
    }

    <table>${lines}</table>

    <div class="total">
      الإجمالي: ${money(o.total)}
    </div>

    <script>
      window.onload=()=>window.print()
    <\/script>

    </html>
  `);

  w.document.close();
}

async function loadOrders(){
  if(!token || loadingOrders) return;

  loadingOrders = true;

  try{
    const d = await api("list");
    const orders = Array.isArray(d.orders) ? d.orders : [];

    for(const o of orders){
      const id = String(o.id);

      if(
        !firstLoad &&
        !knownIds.has(id) &&
        o.status === "new"
      ){
        notifyNew(o);
      }

      knownIds.add(id);
    }

    firstLoad = false;

    $("orders").innerHTML = orders.length
      ? orders.map(orderCard).join("")
      : '<div class="empty">مفيش طلبات لحد دلوقتي</div>';

    $("connection").textContent =
      "متصل — تحديث تلقائي كل 5 ثواني";

    $("lastUpdate").textContent =
      "آخر تحديث: " + new Date().toLocaleTimeString("ar-EG");

    window.currentOrders = orders;

  }catch(e){

    console.error("LOAD ORDERS ERROR:",e,e.data);

    $("connection").textContent =
      "تعذر تحميل الطلبات: " + e.message;

    $("orders").innerHTML = `
      <div class="empty">
        <strong>حصلت مشكلة أثناء تحميل الطلبات</strong>
        <p>${esc(e.message)}</p>
        <button class="btn print" id="retryLoad">
          إعادة المحاولة
        </button>
      </div>
    `;

    if(e.status === 401){
      logout(false);
      showLogin("انتهت الجلسة. سجّل الدخول مرة أخرى.");
    }

  }finally{
    loadingOrders = false;
  }
}

// تسجيل الدخول
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const pin = $("pin").value;

  $("loginError").textContent = "";

  if(!/^\d{4}$/.test(pin)){
    $("loginError").textContent =
      "اكتب 4 أرقام بالضبط";
    return;
  }

  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "جاري التحقق...";

  try{
    const d = await api("login",{pin});

    if(!d.token){
      throw new Error("تم الدخول لكن لم يتم استلام رمز الجلسة");
    }

    token = d.token;

    sessionStorage.setItem(SESSION_KEY,token);

    knownIds.clear();
    firstLoad = true;

    $("login").classList.add("hidden");

    if(
      "Notification" in window &&
      Notification.permission === "default"
    ){
      Notification.requestPermission();
    }

    await loadOrders();

    startPolling();

  }catch(err){
    $("loginError").textContent = err.message;

  }finally{
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "دخول";
    $("pin").value = "";
  }
});

// تغيير حالة الطلب
$("orders").addEventListener("change",async e=>{
  const s = e.target.closest("select[data-order]");

  if(!s) return;

  const id = s.dataset.order;
  const oldValue = s.dataset.oldValue;

  s.disabled = true;

  try{
    await api("update",{
      order_id:id,
      status:s.value
    });

    await loadOrders();

  }catch(err){
    alert(err.message);
    await loadOrders();

  }finally{
    s.disabled = false;
  }
});

// الطباعة وإعادة المحاولة
$("orders").addEventListener("click",e=>{
  const retry = e.target.closest("#retryLoad");

  if(retry){
    loadOrders();
    return;
  }

  const b = e.target.closest("[data-print]");

  if(!b) return;

  const o = (window.currentOrders || [])
    .find(x=>String(x.id) === b.dataset.print);

  if(o) printOrder(o);
});

// تحديث يدوي
$("refresh").addEventListener("click",()=>{
  loadOrders();
});

// تسجيل الخروج
function logout(showMessage=true){
  stopPolling();

  token = "";

  sessionStorage.removeItem(SESSION_KEY);

  knownIds.clear();
  firstLoad = true;

  $("orders").innerHTML =
    '<div class="empty">سجّل الدخول لعرض الطلبات</div>';

  $("connection").textContent =
    "تم تسجيل الخروج";

  $("lastUpdate").textContent = "";

  $("login").classList.remove("hidden");

  if(showMessage){
    $("loginError").textContent = "";
  }
}

$("logout").addEventListener("click",async()=>{
  try{
    if(token){
      await api("logout");
    }
  }catch(error){
    console.error("LOGOUT ERROR:",error);
  }

  logout();
});

// استعادة الجلسة عند إعادة فتح الصفحة
if(token){
  $("login").classList.add("hidden");

  loadOrders().then(()=>{
    if(token){
      startPolling();
    }
  });
}

</script>

</body>
</html>
